[project]
name = "prometheus"
version = "0.1.0"
description = "Personal Telegram chief-of-staff bot. Single user."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[webhooks]>=21.4",
    "apscheduler>=3.10.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "google-genai>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
prometheus = "prometheus.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
"src/prometheus/llm/parser.py" = ["E501"]      # LLM system prompts run long
"src/prometheus/llm/persona.py" = ["E501"]
"src/prometheus/llm/memory.py" = ["E501"]
