services:
  - type: web
    name: prometheus
    env: docker
    plan: starter
    region: singapore
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: prod
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OWNER_TELEGRAM_USER_ID
        sync: false
      # WEBHOOK_URL is optional — if unset, the app falls back to Render's
      # auto-injected RENDER_EXTERNAL_URL. Set this only to override.
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: prometheus-db
          property: connectionString

databases:
  - name: prometheus-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
